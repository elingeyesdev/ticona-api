openapi: 3.0.3
info:
  title: Sistema Valle API
  version: 1.0.0
  description: |
    ## Aplicación y perfiles

    Esta API conecta la aplicación móvil con la API Laravel. Flutter muestra
    los módulos de personal según los permisos que entrega el inicio de sesión.
    El backend vuelve a comprobar permisos en las operaciones móviles y al
    crear encomiendas; las rutas Laravel requieren autenticación Bearer. Los
    permisos de Laravel también se usan para la interfaz web.

    ### Administrador

    El rol `Administrador` recibe todos los permisos creados por Laravel:
    gestión de usuarios, roles y asignaciones; clientes, buses, rutas,
    conductores y tipos; viajes, reservas, boletos, encomiendas, incidencias,
    asientos, asignaciones de conductor, notificaciones, reportes y
    estadísticas. En la app móvil, Usuarios, Roles, Usuario-Rol,
    Asignaciones de conductor, Incidencias, Notificaciones, Reportes y
    Estadísticas aparecen como opciones informativas sin pantalla de gestión;
    esas pantallas no están implementadas en el móvil.

    ### Recepcionista

    Permisos asignados en Laravel:

    - Clientes: `clientes.ver`, `clientes.crear`, `clientes.editar`.
    - Consulta: `buses.ver`, `rutas.ver`, `conductores.ver`,
      `tipoencomiendas.ver`, `tipoincidencias.ver`.
    - Reservas: `reservas.ver`, `reservas.crear`, `reservas.editar`.
    - Viajes: `viajes.ver`, `viajes.crear`, `viajes.editar`.
    - Encomiendas: `encomiendas.ver`, `encomiendas.crear`,
      `encomiendas.editar`.
    - Incidencias: `incidenciaviaje.ver`, `incidenciaviaje.crear`,
      `incidenciaviaje.editar`, `incidenciaviaje.eliminar`.
    - Notificaciones: `notificaciones.ver`, `notificaciones.crear`,
      `notificaciones.editar`, `notificaciones.eliminar`.
    - Asientos: `asientoviaje.ver`, `asientoviaje.crear`,
      `asientoviaje.editar`, `asientoviaje.eliminar`.
    - Boletos: `boletos.ver`, `boletos.crear`, `boletos.editar`,
      `boletos.eliminar`.
    - Reportes: `reportes.ver`, `estadisticas.ver`.

    En la app móvil puede gestionar clientes, viajes, ventas/reservas,
    encomiendas, boletos y asientos según esos permisos. No tiene permisos de
    administración de usuarios/roles, ni permisos para crear, editar o
    eliminar buses, rutas, conductores o tipos.

    ### Cliente

    Puede registrarse e iniciar sesión, consultar viajes y asientos, crear y
    consultar sus propias reservas, enviar el comprobante de una reserva propia,
    consultar sus propias encomiendas y gestionar su sesión/perfil. No recibe
    permisos de personal y no puede registrar encomiendas desde la app.

    **Importante:** una operación de Laravel requiere Bearer, pero no todas las
    rutas Laravel comprueban permisos por rol en el controlador. La matriz
    anterior describe los permisos que asigna Laravel y que usa la interfaz;
    no implica una autorización adicional de servidor distinta de la indicada
    en cada operación. La API móvil sí valida los permisos que señala cada
    endpoint.

    Laravel y la API móvil comparten MySQL. Laravel administra el esquema.
servers:
  - url: http://localhost:8080
    description: Servidor local
tags:
  - name: Salud
    description: Estado del gateway y de la conexión de base de datos.
  - name: Autenticación
    description: Inicio de sesión, registro móvil de clientes, perfil y cierre de sesión.
  - name: Viajes
    description: Búsqueda móvil y gestión Laravel de viajes (`viajes.*`).
  - name: Asientos
    description: Consulta/administración móvil (`asientoviaje.*`) y recursos Laravel (`asientosviaje.*`).
  - name: Clientes
    description: Consulta y administración de clientes (`clientes.*`).
  - name: Reservas
    description: Reservas propias de clientes y operaciones de personal (`reservas.*`).
  - name: Comprobantes
    description: Envío y consulta de comprobantes de pago de clientes.
  - name: Boletos
    description: Boletos y pagos desde móvil y Laravel (`boletos.*`).
  - name: Buses
    description: Gestión Laravel de buses (`buses.*`).
  - name: Conductores
    description: Gestión Laravel de conductores (`conductores.*`).
  - name: Rutas
    description: Gestión Laravel de rutas (`rutas.*`).
  - name: Tipos de encomienda
    description: Catálogo Laravel de tipos de encomienda (`tipoencomiendas.*`).
  - name: Tipos de incidencia
    description: Catálogo Laravel de tipos de incidencia (`tipoincidencias.*`).
  - name: Encomiendas
    description: Consulta móvil de encomiendas propias y administración Laravel (`encomiendas.*`).
  - name: Incidencias
    description: Gestión Laravel de incidencias de viaje (`incidenciaviaje.*`).
  - name: Asignaciones de conductor
    description: Gestión Laravel de asignaciones (`asignacionconductor.*`).
  - name: Notificaciones
    description: Gestión Laravel de notificaciones (`notificaciones.*`).
  - name: Laravel
    description: Rutas de Laravel protegidas con Bearer. Los permisos indicados corresponden a la matriz de roles y a la interfaz; ver la nota de autorización en la descripción general.
paths:
  /api/health:
    get:
      tags: [Salud]
      summary: Consultar el estado de la API
      description: Indica si el gateway está activo y si la conexión MySQL está configurada y disponible.
      responses:
        '200':
          description: API disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '503':
          description: API móvil configurada, pero MySQL no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Autentica una cuenta de cliente o de personal y devuelve un token Bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: cliente@example.com
              password: contraseña-segura
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar una cuenta de cliente
      description: Crea únicamente una cuenta de cliente móvil; no crea cuentas de personal ni asigna permisos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Cuenta de cliente creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar el perfil autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar la sesión autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión de personal en Laravel
      description: Ruta de autenticación Laravel que utiliza internamente la autenticación móvil. En la app se recomienda `/api/auth/login`, que también acepta cuentas de cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión de personal iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión Laravel
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/me:
    get:
      tags: [Autenticación]
      summary: Consultar perfil del personal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/perfil:
    get:
      tags: [Autenticación]
      summary: Consultar perfil del personal (alias de `/api/me`)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/viajes:
    get:
      tags: [Viajes]
      summary: Buscar viajes disponibles
      description: Devuelve viajes programados y disponibles, hasta 100 resultados.
      security:
        - bearerAuth: []
      parameters:
        - name: origen
          in: query
          description: Filtro parcial del origen.
          schema:
            type: string
        - name: destino
          in: query
          description: Filtro parcial del destino.
          schema:
            type: string
        - name: fecha
          in: query
          description: Fecha del viaje en formato YYYY-MM-DD.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de viajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/encomiendas:
    get:
      tags: [Reservas]
      summary: Consultar las encomiendas del cliente
      description: Disponible únicamente para una sesión de cliente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Encomiendas del cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/asientos-viaje/buses:
    get:
      tags: [Asientos]
      summary: Listar buses y viajes para administrar asientos
      description: Requiere el permiso `asientoviaje.ver`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Buses con sus viajes programados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/asientos-viaje/viajes/{viajeId}/asientos:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
    get:
      tags: [Asientos]
      summary: Consultar asientos para administrarlos
      description: Requiere el permiso `asientoviaje.ver`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Asientos configurados para el viaje.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
    patch:
      tags: [Asientos]
      summary: Cambiar el estado de un asiento
      description: Requiere los permisos `asientoviaje.ver` y `asientoviaje.editar`. No permite modificar asientos con boletos vigentes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatUpdateRequest'
      responses:
        '200':
          description: Estado del asiento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
    delete:
      tags: [Asientos]
      summary: Eliminar un asiento del viaje
      description: Requiere los permisos `asientoviaje.ver` y `asientoviaje.eliminar`. No permite eliminar asientos con boletos vigentes.
      security:
        - bearerAuth: []
      parameters:
        - name: numero_asiento
          in: query
          required: true
          schema:
            type: string
            maxLength: 12
      responses:
        '200':
          description: Asiento eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/viajes/{viajeId}/asientos:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
    get:
      tags: [Asientos]
      summary: Consultar los asientos de un viaje
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Asientos y disponibilidad del viaje.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/clientes:
    get:
      tags: [Clientes]
      summary: Buscar clientes para una reserva
      description: Requiere los permisos `clientes.ver` y `reservas.crear`. Devuelve como máximo 50 clientes.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Busca en nombre, apellido, cédula y correo electrónico.
          schema:
            type: string
      responses:
        '200':
          description: Clientes encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/reservas:
    get:
      tags: [Reservas]
      summary: Listar reservas de la cuenta
      description: El personal requiere `reservas.ver`; los clientes consultan sus propias reservas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservas disponibles para la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      tags: [Reservas]
      summary: Crear una reserva
      description: El cliente autenticado reserva para sí mismo; el personal requiere el permiso `reservas.crear` y debe indicar `cliente_id`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/reservas/venta:
    post:
      tags: [Reservas]
      summary: Registrar una venta desde el personal
      description: Requiere una cuenta de personal y el permiso `reservas.crear`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Venta registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/reservas/{reservaId}/comprobante:
    post:
      tags: [Comprobantes]
      summary: Enviar el comprobante de una reserva
      description: Solo el cliente titular puede enviar un archivo JPG, JPEG, PNG o PDF de hasta 5 MB.
      security:
        - bearerAuth: []
      parameters:
        - name: reservaId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [comprobante]
              properties:
                comprobante:
                  type: string
                  format: binary
                  description: Archivo de imagen JPG/JPEG, PNG o documento PDF (máximo 5 MB).
      responses:
        '200':
          description: Comprobante recibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/comprobantes/{filename}:
    get:
      tags: [Comprobantes]
      summary: Descargar un comprobante
      description: El nombre es el identificador aleatorio almacenado por la API; solo se sirven comprobantes existentes con extensión permitida.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}\.(jpg|jpeg|png|pdf)$'
      responses:
        '200':
          description: Contenido del comprobante.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/boletos/{boletoId}/confirmar-pago:
    patch:
      tags: [Boletos]
      summary: Confirmar el pago de un boleto
      description: Requiere una cuenta de personal con el permiso `boletos.editar`. Para verificar manualmente un pago QR, se deben enviar ambos campos opcionales indicados.
      security:
        - bearerAuth: []
      parameters:
        - name: boletoId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmationRequest'
      responses:
        '200':
          description: Pago confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/mobile/boletos/{boletoId}:
    patch:
      tags: [Boletos]
      summary: Actualizar los datos del pasajero de un boleto
      description: Requiere una cuenta de personal con el permiso `boletos.editar`. Solo se editan boletos pendientes o confirmados que no sean especiales.
      security:
        - bearerAuth: []
      parameters:
        - name: boletoId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketPassengerUpdateRequest'
      responses:
        '200':
          description: Datos del pasajero actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          $ref: '#/components/responses/ApiError'
  /api/buses:
    get:
      tags: [Buses]
      summary: Listar buses
      description: Requiere Bearer. El administrador tiene todos los permisos; la recepcionista solo `buses.ver`.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    post:
      tags: [Buses]
      summary: Crear bus
      description: Requiere Bearer; permiso de interfaz `buses.crear` (administrador).
      security: [{bearerAuth: []}]
      requestBody:
        $ref: '#/components/requestBodies/LaravelResource'
      responses:
        '201': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
  /api/buses/{bus}:
    parameters:
      - {name: bus, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Buses]
      summary: Consultar bus
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    put:
      tags: [Buses]
      summary: Reemplazar bus
      description: Requiere Bearer; permiso de interfaz `buses.editar` (administrador).
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/LaravelResource'}
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    patch:
      tags: [Buses]
      summary: Actualizar bus
      description: Requiere Bearer; permiso de interfaz `buses.editar` (administrador).
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/LaravelResource'}
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    delete:
      tags: [Buses]
      summary: Desactivar bus
      description: Requiere Bearer; permiso de interfaz `buses.eliminar` (administrador).
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
  /api/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: Requiere Bearer y `clientes.ver`. Incluye búsqueda por nombre, apellido, cédula o correo y paginación.
      security: [{bearerAuth: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    post:
      tags: [Clientes]
      summary: Crear cliente
      description: Requiere Bearer y `clientes.crear`.
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/LaravelResource'}
      responses:
        '201': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
  /api/clientes/{cliente}:
    parameters:
      - {name: cliente, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Clientes]
      summary: Consultar cliente
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    put:
      tags: [Clientes]
      summary: Reemplazar cliente
      description: Requiere Bearer y `clientes.editar`.
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/LaravelResource'}
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    patch:
      tags: [Clientes]
      summary: Actualizar cliente
      description: Requiere Bearer y `clientes.editar`.
      security: [{bearerAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/LaravelResource'}
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
    delete:
      tags: [Clientes]
      summary: Desactivar cliente
      description: Requiere Bearer y `clientes.eliminar` (administrador).
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ResourceSuccess'}
        default: {$ref: '#/components/responses/ApiError'}
  /api/conductores:
