components:
  parameters:
    ViajeId:
      name: viajeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    ResourceSuccess:
      description: Operación de Laravel completada. Los campos específicos del recurso están definidos por el controlador Laravel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    ApiError:
      description: |
        Error de autenticación o permisos (401/403), recurso no encontrado
        (404), conflicto de estado (409), solicitud no válida (400/422),
        archivo demasiado grande (413), servicio no disponible (503) o error
        interno (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  requestBodies:
    LaravelResource:
      required: true
      description: Objeto JSON validado por el controlador Laravel correspondiente. Consulta el modelo del recurso; los campos pueden variar entre controladores.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaravelResourceRequest'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
    ClientRegistrationRequest:
      type: object
      required: [nombre, apellido, cedula, email, password, password_confirmation]
      properties:
        nombre:
          type: string
          maxLength: 255
        apellido:
          type: string
          maxLength: 255
        cedula:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          description: Hasta 72 bytes UTF-8.
        password_confirmation:
          type: string
          format: password
        telefono:
          type: string
          maxLength: 20
    SeatUpdateRequest:
      type: object
      required: [numero_asiento, estado]
      properties:
        numero_asiento:
          type: string
          maxLength: 12
        estado:
          type: string
          enum: [disponible, bloqueado]
    BookingRequest:
      type: object
      required: [viaje_id, boletos]
      properties:
        viaje_id:
          type: integer
          minimum: 1
        cliente_id:
          type: integer
          minimum: 1
          description: Requerido para las solicitudes de personal; los clientes usan su propia cuenta.
        metodo_pago:
          type: string
          enum: [QR, efectivo, tarjeta]
          default: QR
        boletos:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PassengerRequest'
    PassengerRequest:
      type: object
      required: [numero_asiento]
      properties:
        numero_asiento:
          type: string
          maxLength: 12
        tipo_pasajero:
          type: string
          enum: [normal, comodidad, mascota]
          default: normal
        nombre_pasajero:
          type: string
          maxLength: 255
        ci_pasajero:
          type: string
          maxLength: 50
        telefono_pasajero:
          type: string
          maxLength: 50
    PaymentConfirmationRequest:
      type: object
      properties:
        verificacion_manual:
          type: boolean
          description: Debe ser true para indicar verificación manual.
        canal_verificacion:
          type: string
          enum: [whatsapp]
          description: Enviar whatsapp junto con verificacion_manual=true para registrar la verificación manual.
    TicketPassengerUpdateRequest:
      type: object
      required: [nombre_pasajero, ci_pasajero, telefono_pasajero]
      properties:
        nombre_pasajero:
          type: string
          maxLength: 255
        ci_pasajero:
          type: string
          maxLength: 50
        telefono_pasajero:
          type: string
          maxLength: 50
    LaravelResourceRequest:
      type: object
      additionalProperties: true
      description: Los campos dependen del recurso Laravel seleccionado.
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          description: Datos de la operación; la forma exacta depende del endpoint.
          nullable: true
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
